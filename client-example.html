<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simple</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: #333;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: normal;
        }

        .content {
            padding: 20px;
        }

        /* Auth */
        .auth-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .auth-form {
            flex: 1;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .auth-form h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #555;
        }

        .auth-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: #0056b3;
        }

        .btn-full {
            width: 100%;
        }

        .btn-google {
            background: #dc3545;
            margin-top: 20px;
        }

        .btn-google:hover {
            background: #c82333;
        }

        /* Status */
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Chat */
        .chat-container {
            display: none;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .user-info {
            font-size: 14px;
            color: #666;
        }

        .btn-logout {
            background: #dc3545;
            padding: 8px 12px;
            font-size: 12px;
        }

        .messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .message:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .message-user {
            font-weight: bold;
            color: #007bff;
            font-size: 14px;
        }

        .message-text {
            margin: 5px 0;
            line-height: 1.4;
        }

        .message-time {
            font-size: 12px;
            color: #999;
        }

        .typing-indicator {
            font-style: italic;
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .message-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .message-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .message-input input:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn-send {
            background: #28a745;
            padding: 10px 20px;
        }

        .btn-send:hover {
            background: #218838;
        }

        .connected-users {
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .connected-users h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #555;
        }

        .users-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-tag {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #495057;
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .auth-section {
                flex-direction: column;
            }

            .messages {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Chat Simple</h1>
        </div>

        <div class="content">
            <div id="auth-section" class="auth-section">
                <div class="auth-form">
                    <h3>Iniciar Sesión</h3>
                    <input type="email" id="loginEmail" placeholder="Email">
                    <input type="password" id="loginPassword" placeholder="Contraseña">
                    <button class="btn btn-full" onclick="login()">Entrar</button>
                </div>

                <div class="auth-form">
                    <h3>Registrarse</h3>
                    <input type="email" id="registerEmail" placeholder="Email">
                    <input type="password" id="registerPassword" placeholder="Contraseña">
                    <button class="btn btn-full" onclick="register()">Crear cuenta</button>
                </div>
            </div>

            <button class="btn btn-google btn-full" onclick="loginWithGoogle()">
                Entrar con Google
            </button>

            <div id="status"></div>

            <div id="chat-section" class="chat-container">
                <div class="chat-header">
                    <div class="user-info">
                        Conectado como: <span id="currentUserEmail"></span>
                    </div>
                    <button class="btn btn-logout" onclick="logout()">Salir</button>
                </div>

                <div id="messages" class="messages"></div>
                <div id="typing-indicator" class="typing-indicator" style="display: none;"></div>

                <div class="message-input">
                    <input type="text" id="messageInput" placeholder="Escribe tu mensaje..."
                        onkeypress="handleKeyPress(event)">
                    <button class="btn btn-send" onclick="sendMessage()">Enviar</button>
                </div>

                <div class="connected-users">
                    <h3>Usuarios conectados</h3>
                    <div id="connectedUsers" class="users-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let currentUser = null;
        let typingTimer;
        const API_URL = 'http://localhost:3001';

        function showStatus(message, type = 'success') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
            setTimeout(() => statusDiv.innerHTML = '', 5000);
        }

        async function makeRequest(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                }
            };
            if (data) {
                options.body = JSON.stringify(data);
            }
            const response = await fetch(`${API_URL}${endpoint}`, options);
            return await response.json();
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showStatus('Por favor ingresa email y contraseña', 'error');
                return;
            }

            try {
                const response = await makeRequest('/api/auth/login', 'POST', { email, password });
                if (response.success) {
                    currentUser = response.data.user;
                    localStorage.setItem('token', response.data.token);
                    showStatus('Login exitoso', 'success');
                    showChatSection();
                    connectToChat(response.data.token);
                } else {
                    showStatus(response.error, 'error');
                }
            } catch (error) {
                showStatus('Error en el login', 'error');
            }
        }

        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            if (!email || !password) {
                showStatus('Por favor ingresa email y contraseña', 'error');
                return;
            }

            try {
                const response = await makeRequest('/api/auth/register', 'POST', { email, password });
                if (response.success) {
                    currentUser = response.data.user;
                    localStorage.setItem('token', response.data.token);
                    showStatus('Registro exitoso', 'success');
                    showChatSection();
                    connectToChat(response.data.token);
                } else {
                    showStatus(response.error, 'error');
                }
            } catch (error) {
                showStatus('Error en el registro', 'error');
            }
        }

        function showChatSection() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('chat-section').style.display = 'block';
            if (currentUser) {
                document.getElementById('currentUserEmail').textContent = currentUser.email;
            }
        }

        function connectToChat(token) {
            socket = io(API_URL, {
                auth: { token: token }
            });

            socket.on('connect', () => {
                showStatus('Conectado al chat', 'success');
            });

            socket.on('recentMessages', (messages) => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                messages.reverse().forEach(message => {
                    displayMessage(message);
                });
            });

            socket.on('newMessage', (message) => {
                displayMessage(message);
            });

            socket.on('userConnected', (user) => {
                showStatus(`${user.email} se conectó`, 'success');
            });

            socket.on('userDisconnected', (user) => {
                showStatus(`${user.email} se desconectó`, 'error');
            });

            socket.on('connectedUsers', (users) => {
                displayConnectedUsers(users);
            });

            socket.on('userTyping', (data) => {
                const typingDiv = document.getElementById('typing-indicator');
                if (data.isTyping) {
                    typingDiv.textContent = `${data.email} está escribiendo...`;
                    typingDiv.style.display = 'block';
                } else {
                    typingDiv.style.display = 'none';
                }
            });

            socket.on('error', (error) => {
                showStatus(`Error: ${error.message}`, 'error');
            });

            socket.on('disconnect', () => {
                showStatus('Desconectado del chat', 'error');
            });
        }

        function displayMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';

            const time = new Date(message.createdAt).toLocaleTimeString();
            messageElement.innerHTML = `
                <div class="message-user">${message.user.email}</div>
                <div class="message-text">${message.text}</div>
                <div class="message-time">${time}</div>
            `;

            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function displayConnectedUsers(users) {
            const connectedUsersDiv = document.getElementById('connectedUsers');
            connectedUsersDiv.innerHTML = users.map(user => `
                <div class="user-tag">${user.email}</div>
            `).join('');
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const text = messageInput.value.trim();

            if (!text) return;

            socket.emit('sendMessage', { text });
            messageInput.value = '';
            socket.emit('typing', { isTyping: false });
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            } else {
                socket.emit('typing', { isTyping: true });
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    socket.emit('typing', { isTyping: false });
                }, 1000);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            currentUser = null;
            if (socket) socket.disconnect();
            document.getElementById('chat-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'flex';
            showStatus('Sesión cerrada', 'success');
        }

        function loginWithGoogle() {
            window.location.href = "http://localhost:3001/api/auth/google/";
        }

        window.onload = function () {
            const token = localStorage.getItem('token');
            if (token) {
                showChatSection();
                connectToChat(token);
            }
        };

        window.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");
            if (token) {
                localStorage.setItem("token", token);
                const newUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, document.title, newUrl);
                showChatSection();
                connectToChat(token);
                showStatus("Login con Google exitoso", "success");
            }
        });
    </script>
</body>

</html>
